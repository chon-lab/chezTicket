spring:
  application:
    name: chezticket-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:8080/chezticket}
    username: ${SPRING_DATASOURCE_USERNAME:chezticket}
    password: ${SPRING_DATASOURCE_PASSWORD:chezticket}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: chezticket-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # O schema é responsabilidade exclusiva do Flyway. O Hibernate nunca altera tabelas.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    org.flywaydb: info

chezticket:
  # Pasta onde as imagens enviadas (capa/divulgação de evento) são salvas.
  # Servidas em /api/uploads/** (ver UploadConfig).
  uploads-dir: ${CHEZTICKET_UPLOADS_DIR:uploads}
  # Origem pública da API (sem o sufixo /api), usada para montar URLs
  # absolutas de imagem quando o front está em outra origem (produção).
  # Vazio em dev: as URLs ficam relativas e passam pelo proxy do Vite.
  public-api-url: ${CHEZTICKET_PUBLIC_API_URL:}
  # Origem do front, usada para montar as URLs de volta (success/cancel) do
  # Stripe Checkout. Em dev, o servidor do Vite.
  frontend-url: ${CHEZTICKET_FRONTEND_URL:http://localhost:5173}
  stripe:
    # Chaves de teste (sk_test_.../pk_test_...) — nunca comitar valores reais,
    # só via variável de ambiente. Sem elas, o checkout pago falha com uma
    # mensagem clara em vez de uma NullPointerException.
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

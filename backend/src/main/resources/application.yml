spring:
  application:
    name: chezticket-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:8080/chezticket}
    username: ${SPRING_DATASOURCE_USERNAME:chezticket}
    password: ${SPRING_DATASOURCE_PASSWORD:chezticket}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: chezticket-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # O schema é responsabilidade exclusiva do Flyway. O Hibernate nunca altera tabelas.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    org.flywaydb: info
